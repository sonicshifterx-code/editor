<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0f1418">
<title>Тихий монтаж — видеоредактор</title>
<style>
:root{--bg:#0f1418;--p:#161d23;--p2:#1e2830;--ln:#2a3640;--tx:#d5dee5;--mu:#7d8c97;--ac:#c5d0d8;--ac2:#ffffff}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:13px system-ui,"Segoe UI",sans-serif;overflow:hidden;user-select:none}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:44px minmax(0,1fr) 300px;overflow:hidden}#app>*{min-width:0}
#top{display:flex;gap:8px;align-items:center;padding:0 12px;background:var(--p);border-bottom:1px solid var(--ln)}
#pn{background:transparent;border:1px solid transparent;color:var(--tx);font:600 15px system-ui;padding:4px 8px;border-radius:4px;width:260px}
#pn:hover,#pn:focus{border-color:var(--ln);outline:0}
button{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:4px;padding:5px 10px;cursor:pointer;font:inherit}
button:hover{border-color:var(--ac)}button.pri{background:var(--ac);color:#06201b;border-color:var(--ac);font-weight:600}button.act{border-color:var(--ac2);color:var(--ac2)}
.sp{flex:1}.mu,small{color:var(--mu)}
main{display:grid;grid-template-columns:230px minmax(0,1fr) 285px;min-height:0;min-width:0;overflow:hidden}
aside{background:var(--p);overflow:auto;padding:10px;min-height:0;min-width:0}#lib{border-right:1px solid var(--ln)}#props{border-left:1px solid var(--ln)}
h3{margin:0 0 8px;font-size:13px;font-weight:600;word-break:break-all}
.lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mi{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto auto;gap:4px;align-items:center;padding:6px;border:1px solid var(--ln);border-radius:4px;margin-bottom:6px;background:var(--p2);cursor:grab}
.mi.miss{opacity:.5;border-style:dashed}.mi .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mi button{padding:2px 6px}
#pv{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:#000}
#pv:fullscreen{background:#000;width:100vw;height:100vh}
#pv:fullscreen #tp{background:rgba(22,29,35,.92);border-top:1px solid var(--ln);padding:10px;z-index:10}
#stage{flex:1;min-height:0;min-width:0;background:#000;position:relative;overflow:hidden}#stage:fullscreen{background:#000}
#cv{position:absolute;left:0;top:0;display:block}
#stage{touch-action:none}
#zmk{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #000,0 0 10px rgba(0,0,0,.7);cursor:move;z-index:6;display:none;touch-action:none}
#zmk::before,#zmk::after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#zmk::before{left:50%;top:-8px;bottom:-8px;width:2px;margin-left:-1px}
#zmk::after{top:50%;left:-8px;right:-8px;height:2px;margin-top:-1px}
.fh{position:absolute;top:3px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ac2);cursor:ew-resize;z-index:4}.fh:hover{background:var(--ac2)}
.pr{display:flex;gap:4px;flex-wrap:wrap;margin:-3px 0 10px}.pr button{padding:2px 6px;font-size:11px}
#tp{display:flex;gap:6px;align-items:center;justify-content:center;padding:6px;background:var(--p);border-top:1px solid var(--ln)}
#tm{font:13px ui-monospace,Consolas,monospace;min-width:170px;text-align:center}
#tl{display:flex;flex-direction:column;border-top:1px solid var(--ln);min-height:0;min-width:0;width:100%;overflow:hidden}
#tb{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--p);flex-wrap:wrap}#tb i{width:1px;height:18px;background:var(--ln)}
.zgrp{display:inline-flex;align-items:center;gap:2px;background:var(--bg);padding:2px;border-radius:5px;border:1px solid var(--ln)}
.zgrp button{min-width:28px;padding:3px 8px;font-weight:700;border-color:transparent}
#scroll{flex:1;min-width:0;min-height:0;max-width:100%;overflow:auto;position:relative;background:#11181d}#wrap{position:relative;min-height:100%}
.row{display:flex;height:58px}.row.rw{height:24px;position:sticky;top:0;z-index:4;background:var(--p)}
.hd{position:sticky;left:0;z-index:6;flex:none;width:140px;background:var(--p);border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:5px 8px}
.hd.corner{padding:0;height:24px}.hn{display:flex;justify-content:space-between;margin-bottom:5px}.hn button{padding:0 4px;font-size:11px;border:0;background:none}
.hn button.off{opacity:.35}
.hn button.lck{opacity:.333;transition:opacity .15s}.hn button.lck.on{opacity:1}
.tv{width:100%;margin:0}
.ru{position:relative;flex:none;height:24px;cursor:pointer}
.ru i{position:absolute;top:0;height:100%;border-left:1px solid var(--ln);padding-left:3px;font:10px ui-monospace,Consolas,monospace;color:var(--mu);font-style:normal;pointer-events:none}
.lane{position:relative;flex:none;height:58px;border-bottom:1px solid var(--ln);background:#131a1f}.lane.off{opacity:.45}
.clip{position:absolute;top:4px;height:50px;border-radius:4px;overflow:hidden;cursor:grab;border:1px solid rgba(255,255,255,.2)}
.clip.v{background:#2c5f7c}.clip.a{background:#35634a}.clip.miss{background:#5a3a3a}.clip.sel{outline:2px solid var(--ac2);z-index:2}
.clip span{position:absolute;left:8px;top:3px;font-size:11px;white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px #000}
.clip canvas{position:absolute;left:0;top:0;width:100%;height:100%;opacity:.65;pointer-events:none}
.h{position:absolute;top:0;width:7px;height:100%;cursor:ew-resize;z-index:3}.h:hover{background:rgba(255,255,255,.4)}.h.l{left:0}.h.r{right:0}
.fd{position:absolute;top:0;height:100%;pointer-events:none}
.fi{left:0;background:linear-gradient(to top right,rgba(0,0,0,.55) 50%,transparent 50%)}.fo{right:0;background:linear-gradient(to top left,rgba(0,0,0,.55) 50%,transparent 50%)}
#ph,#snl{position:absolute;top:0;bottom:0;width:2px;z-index:5;pointer-events:none}#ph{background:var(--ac2)}#snl{background:var(--ac);display:none;box-shadow:0 0 6px var(--ac)}
#selbox{position:absolute;border:1px solid var(--ac);background:rgba(94,194,176,.18);pointer-events:none;z-index:8;display:none;border-radius:2px}
label{display:block;margin-bottom:9px;color:var(--mu)}label span{float:right;color:var(--tx)}
label input[type=range],label input[type=number]{width:100%;display:block;margin-top:3px}label input[type=number]{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:4px;padding:4px}
label.ck{color:var(--tx)}
.fxsec select{width:100%;display:block;margin-top:3px;background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:4px;padding:4px}label.ck input{display:inline;width:auto;margin-right:6px}
input[type=range]{accent-color:var(--ac)}
.fxsec{border:1px solid var(--ln);background:var(--p2);border-radius:6px;padding:8px;margin-bottom:9px}
.fxh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:600;color:var(--tx)}
.fxh label.ck{margin:0;font-weight:600}
.fxh button{padding:1px 6px;font-size:11px}
.eqg{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;align-items:center;text-align:center;padding:4px 0}
.eqb{display:flex;flex-direction:column;align-items:center;gap:3px}
.eqb b{font:9px ui-monospace,Consolas,monospace;color:var(--ac);height:11px}
.eqb small{font-size:9px;color:var(--mu)}
.eqv{writing-mode:vertical-lr;direction:rtl;width:16px;height:88px;margin:0;padding:0;cursor:pointer}
.ptabs{display:flex;gap:4px;margin-bottom:10px}
.ptabs button{flex:1;padding:4px 6px;font-size:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--p2);border:1px solid var(--ac);padding:8px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;max-width:80%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50}.modal[hidden]{display:none}
.box{background:var(--p);border:1px solid var(--ln);border-radius:8px;padding:18px;width:380px}.box select,.box input{width:100%;background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:4px;padding:6px;margin-top:3px;display:block}
.box progress{width:100%;margin-top:10px}.bt{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.mk{position:absolute;bottom:3px;width:11px;height:11px;margin-left:-5.5px;background:#ffd24a;border:1.5px solid #1a1200;transform:rotate(45deg);z-index:5;cursor:ew-resize;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.mk:hover{background:#fff1a8}.mk.sel{background:#fff;box-shadow:0 0 0 2px #ffd24a,0 0 8px #ffd24a}
.mkrow{display:flex;gap:4px;align-items:center;padding:3px 4px;border:1px solid var(--ln);border-radius:4px;margin-bottom:4px;background:var(--bg);cursor:pointer}
.mkrow.sel{border-color:#ffd24a}.mkrow.out{opacity:.45}.mkrow b{font:11px ui-monospace,Consolas,monospace;flex:1;font-weight:400}
.mkrow select{width:auto!important;display:inline-block!important;margin:0!important;padding:1px 2px!important;font-size:11px}.mkrow button{padding:0 6px;font-size:11px}

/* ===== iPad Pro ===== */
:root{--lh:58px;--rh:24px;--toph:44px;--tlh:clamp(250px,40vh,400px)}
*{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}

body{-webkit-user-select:none}
input[type=number],#pn,.box input{-webkit-user-select:text;user-select:text}
#app{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);grid-template-rows:var(--toph) minmax(0,1fr) var(--tlh)}
#pn{min-width:0;flex:1 1 120px;max-width:260px;width:auto}
main{grid-template-columns:230px minmax(0,1fr) 300px}
#pv:-webkit-full-screen{background:#000;width:100vw;height:100vh}
#pv.pfs{position:fixed;inset:0;z-index:60;background:#000}
#pv.pfs #tp,#pv:-webkit-full-screen #tp{background:rgba(22,29,35,.92);border-top:1px solid var(--ln);padding:10px;z-index:10}
#tb{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:none}
#tb::-webkit-scrollbar{display:none}#tb>*{flex:none}#tb button{white-space:nowrap}
.row{height:var(--lh)}.row.rw{height:var(--rh)}.hd.corner{height:var(--rh)}.ru{height:var(--rh)}.lane{height:var(--lh)}.clip{height:calc(var(--lh) - 8px)}
#scroll,#scroll *{touch-action:pan-x pan-y}
#scroll .clip,#scroll .clip *,#scroll .ru,#scroll .ru *,#scroll .tv{touch-action:none}
#scroll.boxmode .lane{touch-action:none}
input[type=range],.eqv{touch-action:none}
.ghost{position:fixed;z-index:90;pointer-events:none;padding:6px 10px;background:var(--ac);color:#06201b;border-radius:6px;font-weight:600;max-width:220px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lane.dt{outline:2px dashed var(--ac2);outline-offset:-2px}
.box{width:min(420px,92vw);max-height:92vh;overflow:auto}
.mi .dg{display:flex;align-items:center;justify-content:center;touch-action:none}
.fh::after{content:"";position:absolute;inset:-12px}.mk::after{content:"";position:absolute;inset:-10px}
@media (hover:none){button:hover{border-color:var(--ln)}button.act,button.act:hover{border-color:var(--ac2)}button.pri:hover{border-color:var(--ac)}}
@media (max-width:1100px){main{grid-template-columns:190px minmax(0,1fr) 280px}}
@media (max-width:900px){main{grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,52%) minmax(0,1fr)}#pv{grid-column:1/-1;grid-row:1}#lib{grid-column:1;grid-row:2;border-top:1px solid var(--ln)}#props{grid-column:2;grid-row:2;border-top:1px solid var(--ln)}:root{--tlh:clamp(240px,34vh,400px)}}
@media (pointer:coarse){
:root{--toph:56px}
body{font-size:14px}
button{min-height:40px;padding:6px 14px;font-size:14px;border-radius:6px}
.mi button,.fxh button,.pr button,.mkrow button,.ptabs button,.zgrp button{min-height:36px;min-width:36px;padding:4px 10px;font-size:13px}
.hn button{min-width:32px;min-height:32px;font-size:15px;padding:0}
input,select{font-size:16px!important}
#pn{min-height:40px}
label input[type=number],.fxsec select,.box select,.box input{min-height:40px}
label{margin-bottom:12px}
.mi{grid-template-columns:36px minmax(0,1fr) auto auto auto;padding:8px 6px}
.mi .dg{min-height:40px;font-size:18px}
.mkrow{padding:6px}
#tp{gap:10px;padding:8px}
input[type=range]:not(.eqv){-webkit-appearance:none;appearance:none;background:transparent;height:32px}
input[type=range]:not(.eqv)::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--ln)}
input[type=range]:not(.eqv)::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--ac);border:2px solid var(--bg);margin-top:-10px}
.eqv{width:28px;height:130px}
.tv{height:24px}
.h{width:min(24px,35%)}
.fh{width:16px;height:16px;top:5px}
.mk{width:15px;height:15px;margin-left:-7.5px;bottom:5px}
.clip span{font-size:12px}
#zmk{width:48px;height:48px;margin:-24px 0 0 -24px}
}
</style></head><body>
<div id="app">
<header id="top"><input id="pn" value="Новый проект"><button data-act="open">Открыть проект</button><button data-act="save">Сохранить проект</button><span class="sp"></span><button class="pri" data-act="export">Экспорт</button></header>
<main>

</div>

<script>
const $=id=>document.getElementById(id),HW=140,CK={e:0,c:0,s:0,t:0,h:0,sh:0};
const COARSE=matchMedia('(pointer:coarse)').matches,LH=COARSE?72:58,RH=COARSE?34:24;
document.documentElement.style.setProperty('--lh',LH+'px');document.documentElement.style.setProperty('--rh',RH+'px');
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement||null;
let lastE=null,autoT=0,pinch=null,selMode=false,lt={t:0,x:0,y:0,k:''};const pts=new Map();
/* двойной тап/клик (на touch e.detail не работает) */
function isDbl(e,key){const n=performance.now(),d=n-lt.t<380&&lt.k===key&&Math.hypot(e.clientX-lt.x,e.clientY-lt.y)<24;lt=d?{t:0,x:0,y:0,k:''}:{t:n,x:e.clientX,y:e.clientY,k:key};return d}
/* автопрокрутка таймлайна у краёв при перетаскивании */
function stopAuto(){clearInterval(autoT)}
function startAuto(){stopAuto();autoT=setInterval(()=>{const D=drag;if(!D||!lastE||!(D.moved||D.k=='sk'))return;const sc=$('scroll'),r=sc.getBoundingClientRect(),x=lastE.clientX,L=r.left+HW+36,Rr=r.right-36;let v=0;if(x<L)v=-Math.min(22,(L-x)/4+2);else if(x>Rr)v=Math.min(22,(x-Rr)/4+2);if(v){const b=sc.scrollLeft;sc.scrollLeft+=v;if(sc.scrollLeft!==b)dragMove(lastE)}},16)}
const EQF=[63,125,250,500,1000,2000,4000,8000,16000];
const EQL=['63','125','250','500','1k','2k','4k','8k','16k'];
const defMaster=()=>({
 on:true,gain:0,
 eqOn:true,eq:[0,0,0,0,0,0,0,0,0],
 stOn:true,pan:0,width:100,
 compOn:false,cTh:-18,cRa:4,cAt:0.01,cRe:0.15,
 limOn:true,lTh:-1
});
const defGeo=()=>({sc:1,sx:1,sy:1,rot:0,px:0,py:0,cl:0,cr:0,ct:0,cb:0,fl:false});
/* Плавный зум (наезд камеры): from→to по времени клипа, p0/p1 — % длительности клипа, fx/fy — точка фокуса (% от половины кадра) */
const defZm=()=>({on:false,from:1,to:1.3,p0:0,p1:100,ease:'smooth',yo:false,fx:0,fy:0,sp:1});
const zmDur=c=>{const z=c.zm,a=(+z.p0||0)/100*c.d,b=Math.max(a+.01,(+z.p1||100)/100*c.d);return ((b-a)/Math.max(.05,+z.sp||1)).toFixed(2)+' с'};
const EASE={smooth:u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2,in:u=>u*u,out:u=>1-(1-u)*(1-u),linear:u=>u};

async function renderAudioWindow(winStart,winDur,cl,decCache){
 const sr=48000,len=Math.max(1,Math.round(winDur*sr));
 const winEnd=winStart+winDur;
 const active=cl.filter(c=>{
  if(c.mute)return false;
  const tr=trk(c.tr);if(!tr||!tr.on||c.vol*tr.vol<=0)return false;
  return c.s<winEnd&&c.s+c.d>winStart;
 });
 if(!active.length)return null;

 const oac=new OfflineAudioContext(2,len,sr);
 const masterChain=buildMasterGraph(oac,oac.destination);

 for(const c of active){
  const tr=trk(c.tr),vol=c.vol*tr.vol;
  try{
   if(!decCache[c.m]){
    const f=F[c.m].file;
    if(f.size<2.5e8){
     const ab=await f.arrayBuffer();
     const acTmp=new(window.AudioContext||webkitAudioContext)({sampleRate:sr});
     decCache[c.m]=await acTmp.decodeAudioData(ab);
     await acTmp.close();
    }
   }
   const buf=decCache[c.m];
   if(!buf)continue;
   const src=oac.createBufferSource();
   src.buffer=buf;
   const g=oac.createGain();

   const ovStart=Math.max(winStart,c.s);
   const ovEnd=Math.min(winEnd,c.s+c.d);
   const dur=ovEnd-ovStart;
   if(dur<=0)continue;

   const localStart=ovStart-winStart;
   const offsetInMedia=c.i+(ovStart-c.s);

   const envAt=absT=>{
    const rel=absT-c.s,rem=(c.s+c.d)-absT;
    const fi=c.fi||0,fo=c.fo||0,tiny=0.004;
    let m=1;
    if(fi>0){if(rel<fi)m=Math.min(m,rel/fi)}
    else if(rel<tiny)m=Math.min(m,rel/tiny);
    if(fo>0){if(rem<fo)m=Math.min(m,rem/fo)}
    else if(rem<tiny)m=Math.min(m,rem/tiny);
    return Math.max(0,m*vol);
   };

   const pts=new Set([ovStart,ovEnd]);
   const fiEnd=c.s+(c.fi||0.004),foStart=c.s+c.d-(c.fo||0.004);
   if(fiEnd>ovStart&&fiEnd<ovEnd)pts.add(fiEnd);
   if(foStart>ovStart&&foStart<ovEnd)pts.add(foStart);
   const sorted=[...pts].sort((a,b)=>a-b);

   g.gain.setValueAtTime(envAt(sorted[0]),sorted[0]-winStart);
   for(let i=1;i<sorted.length;i++){
    g.gain.linearRampToValueAtTime(envAt(sorted[i]),sorted[i]-winStart);
   }

   src.connect(g);g.connect(masterChain.input);
   src.start(localStart,offsetInMedia,dur);
  }catch(e){}
 }

}

function seekExact(v,time){

  const target=Math.max(0,Math.min((v.duration||1e9)-0.001,time));
  if(Math.abs(v.currentTime-target)<0.005&&v.readyState>=2&&!v.seeking)return res();
  let done=false;
  const finish=()=>{if(done)return;done=true;v.removeEventListener('seeked',finish);clearTimeout(tm);res()};
  const tm=setTimeout(finish,300);
  v.addEventListener('seeked',finish);
  try{v.currentTime=target}catch(e){finish()}
 });
}

function stepVideoPlayback(v,targetTime,dt){
 return new Promise(res=>{
  const dur=v.duration||1e9;
  const want=Math.max(0,Math.min(dur-0.001,targetTime));
  const diff=want-v.currentTime;
  if(Math.abs(diff)>0.12){
   v.pause();
   seekExact(v,want).then(res);
   return;
  }
  if(diff<=0.004&&v.readyState>=2){
   res();
   return;
  }
  let done=false;
  const finish=()=>{if(done)return;done=true;clearTimeout(tm);res()};
  const tm=setTimeout(finish,Math.max(18,Math.ceil(dt*1500)));
  const check=()=>{
   if(done)return;
   if(v.currentTime>=want-0.004||v.ended){
    finish();
   }else{
    setTimeout(check,2);
   }
  };
  if(v.paused){
   v.playbackRate=1.0;
   v.play().then(check).catch(()=>{seekExact(v,want).then(finish)});
  }else{
   check();
  }
 });
}

 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

   ecx.globalAlpha=1;ecx.fillStyle='#000';ecx.fillRect(0,0,W,H);
   for(const c of activeClips){
    const v=xv[c.id];
    const ec=evalClip(c,curT);
    ecx.globalAlpha=fade(c,curT)*(ec.op??1);
    const srcImg=(Object.values(ec.c).some(Boolean)&&gpuGrade)?gpuGrade(v,ec.c):v;
    drawTransformedVideo(ecx,srcImg,v.videoWidth,v.videoHeight,ec,W,H,curT);
   }
   ecx.globalAlpha=1;

   while(vEnc.encodeQueueSize>10||(aEnc&&aEnc.encodeQueueSize>20))await new Promise(r=>setTimeout(r,2));
   if(vEnc.state!=='configured')throw(encErr||new Error('Видеокодек неожиданно закрылся'));
   const vf=new VideoFrame(ecv,{timestamp:Math.round(curT*1e6),duration:Math.round(1e6/fps)});
   vEnc.encode(vf,{keyFrame:f%(fps*2)===0});
   vf.close();

   if(f%5===0||f===totalFrames-1){
    const p=(f+1)/totalFrames;
    $('xpg').value=p*0.98;
    $('xs').textContent=(xH?'Потоковая запись на диск: ':'Экспорт: ')+Math.round(p*100)+'% ('+(f+1)+'/'+totalFrames+' кадр.)';
    await new Promise(r=>setTimeout(r,0));
   }
  }

  Object.values(xv).forEach(v=>v.pause());
  $('xs').textContent='Завершение записи MP4 на диск…';
  await vEnc.flush();vEnc.close();
  if(aEnc&&aEnc.state==='configured'){await aEnc.flush();aEnc.close()}

  muxer.finalize();

  if(fileStream){
   await fileStream.close();
   fileStream=null;
  }else{
   const outBuf=target.buffer;
   const a=document.createElement('a');
   a.href=URL.createObjectURL(new Blob([outBuf],{type:'video/mp4'}));
   a.download=($('xn').value||'video').replace(/[\/:*?"<>|]/g,'_')+'.mp4';
   document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),4000);
  }
  $('xpg').value=1;
  $('xs').textContent='Готово — файл сохранён'+(xH?': '+xH.name:' в «Загрузки».');
 }catch(err){
  if(fileStream){try{await fileStream.abort()}catch(e){}}
  $('xs').textContent=(xCancel||err.message=='cancel')?'Экспорт отменён.':'Ошибка: '+(err.message||err);
 }finally{
  Object.values(xv).forEach(v=>{v.pause();v.removeAttribute('src');v.load()});
  xBusy=false;wlOff();$('xg').disabled=false;$('xc').textContent='Закрыть';
 }
};
